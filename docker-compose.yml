version: '3.8'

networks:
  hardware-nexus-net:
    driver: bridge

services:
  mysql-db:
    image: mysql:8.0
    container_name: hardware-nexus-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hardware_nexus_db
    ports:
      - "3306:3306"
    volumes:
      - ./database/01_schema_ev3.sql:/docker-entrypoint-initdb.d/01_schema_ev3.sql:ro
      - ./database/02_seed_data.sql:/docker-entrypoint-initdb.d/02_seed_data.sql:ro
      - mysql-nexus-data:/var/lib/mysql
    networks:
      - hardware-nexus-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql-nexus-data:
